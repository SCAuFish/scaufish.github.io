<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' blob:; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'self' https://paris-athens-october-checklist.shenchg126.chatgpt.site; base-uri 'none'; form-action 'none'"><title>私人行程 · 输入 PIN</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f1f5fd;color:#15254c;font:16px/1.7 Arial,'PingFang SC',sans-serif;padding:24px}.card{width:100%;max-width:440px;padding:44px 36px;background:white;border:1px solid #d4deef;border-radius:16px;box-shadow:0 18px 65px #1535770b}.icon{height:52px;width:52px;background:#1d45bb;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:25px;margin-bottom:26px}.eyebrow{font-size:12px;color:#5573b0;letter-spacing:.16em}h1{font-size:30px;line-height:1.4;margin:12px 0}p{color:#69768e;font-size:15px;margin:12px 0 27px}label{font-size:14px;font-weight:bold;display:block;margin-bottom:8px}input{font:24px/1.5 monospace;letter-spacing:.13em;border:1px solid #b9c8e4;border-radius:7px;width:100%;padding:12px;color:#142650;background:#f9fbff}input:focus{outline:3px solid #b6c9ff;outline-offset:2px}button{background:#1d45bb;color:white;border:0;padding:14px;width:100%;border-radius:7px;margin-top:17px;font:600 16px Arial,'PingFang SC',sans-serif;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.error{min-height:25px;font-size:14px;color:#b02d28;margin:12px 0 0}.foot{border-top:1px solid #e6ebf5;padding-top:20px;margin-top:18px;font-size:13px;color:#79859a}.hint{font-size:13px;color:#8190a8;margin:7px 0 0}@media(max-width:440px){.card{padding:30px 25px}}</style></head><body><main class="card"><div class="icon" aria-hidden="true">↗</div><div class="eyebrow">BY INVITATION ONLY</div><h1>这是一份私人行程。</h1><p>输入邀请人给你的 PIN，<br>查看行程，并一起更新准备清单。</p><form id="unlock"><label for="pin">8 位数字 PIN</label><input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" required aria-describedby="hint error"><div class="hint" id="hint">PIN 请向邀请人获取。</div><button id="button" type="submit">解锁行程 →</button><p id="error" class="error" role="alert"></p></form><div class="foot">行程内容已加密。此页面不会保存你的 PIN；刷新后需重新解锁。<br><a href="https://scaufish.github.io/" style="display:inline-block;margin-top:12px;color:#1d45bb;text-underline-offset:3px">返回个人主页 / Home</a></div></main><script>
const form=document.getElementById('unlock'),field=document.getElementById('pin'),button=document.getElementById('button'),message=document.getElementById('error');
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
form.addEventListener('submit',async event=>{event.preventDefault();const pin=field.value.replace(/[\s-]/g,'');if(!/^\d{8}$/.test(pin)){message.textContent='请输入完整的 8 位数字 PIN。';return;}button.disabled=true;button.textContent='正在解锁…';message.textContent='';let payload;try{const response=await fetch('./content.enc.json',{cache:'no-store'});if(!response.ok)throw Error();payload=await response.json();}catch{message.textContent='页面内容暂时无法加载，请检查网络后重试。';button.disabled=false;button.textContent='解锁行程 →';return;}try{if(!window.crypto?.subtle)throw Error('CRYPTO_UNAVAILABLE');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));field.value='';document.open();document.write(new TextDecoder().decode(plain));document.close();}catch(error){message.textContent=error.message==='CRYPTO_UNAVAILABLE'?'请使用支持安全加密的新版浏览器打开 HTTPS 链接。':'PIN 不正确，请确认后重试。';button.disabled=false;button.textContent='解锁行程 →';field.focus();}});
</script></body></html>

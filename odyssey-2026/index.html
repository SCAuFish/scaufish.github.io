<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' blob:; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'self' https://paris-athens-october-checklist.shenchg126.chatgpt.site; base-uri 'none'; form-action 'none'"><title>Odyssey 2026</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f1f5fd;color:#15254c;font:16px/1.7 Arial,'PingFang TC',sans-serif;padding:24px}.card{width:100%;max-width:460px;padding:36px;background:white;border:1px solid #d4deef;border-radius:16px;box-shadow:0 18px 65px #1535770b}.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.icon{height:52px;width:52px;background:#1d45bb;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:25px}select{background:white;border:1px solid #b9c8e4;border-radius:6px;padding:9px;color:#244878}.eyebrow{font-size:12px;color:#5573b0;letter-spacing:.16em}h1{font-size:30px;line-height:1.4;margin:12px 0}p{color:#69768e;font-size:15px;margin:12px 0 27px}label{font-size:14px;font-weight:bold;display:block;margin-bottom:8px}input{font:24px/1.5 monospace;letter-spacing:.13em;border:1px solid #b9c8e4;border-radius:7px;width:100%;padding:12px;color:#142650;background:#f9fbff}input:focus,select:focus-visible{outline:3px solid #b6c9ff;outline-offset:2px}button{background:#1d45bb;color:white;border:0;padding:14px;width:100%;border-radius:7px;margin-top:17px;font:600 16px Arial,sans-serif;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.error{min-height:25px;font-size:14px;color:#b02d28;margin:12px 0 0}.foot{border-top:1px solid #e6ebf5;padding-top:20px;margin-top:18px;font-size:13px;color:#79859a}.hint{font-size:13px;color:#8190a8;margin:7px 0 0}.home{display:inline-block;margin-top:12px;color:#1d45bb;text-underline-offset:3px}@media(max-width:440px){.card{padding:28px 24px}}</style></head><body><main class="card"><div class="card-top"><div class="icon" aria-hidden="true">↗</div><select id="language" aria-label="语言"><option value="zh-Hans" lang="zh-Hans">简体中文</option><option value="en" lang="en">English</option><option value="zh-Hant" lang="zh-Hant">繁體中文</option></select></div><div class="eyebrow">BY INVITATION ONLY</div><h1>Odyssey 2026</h1><p data-copy="intro"></p><form id="unlock"><label for="pin" data-copy="label"></label><input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" required aria-describedby="hint error"><div class="hint" id="hint" data-copy="hint"></div><button id="button" type="submit"></button><p id="error" class="error" role="alert"></p></form><div class="foot"><span data-copy="foot"></span><br><a class="home" href="https://scaufish.github.io/" data-copy="home"></a></div></main><script>
const copy={"zh-Hans":{"title":"输入 PIN","intro":"输入邀请人给你的 PIN，查看行程，并一起更新准备清单。","label":"8 位数字 PIN","hint":"PIN 请向邀请人获取。","unlock":"解锁行程 →","invalid":"请输入完整的 8 位数字 PIN。","loading":"正在解锁…","network":"页面内容暂时无法加载，请检查网络后重试。","crypto":"请使用支持安全加密的新版浏览器打开 HTTPS 链接。","wrong":"PIN 不正确，请确认后重试。","foot":"行程内容已加密。此页面不会保存你的 PIN；刷新后需重新解锁。","home":"返回个人主页","language":"语言"},"en":{"title":"Enter PIN","intro":"Enter the PIN from your host to view the itinerary and keep track of trip preparations together.","label":"8-digit PIN","hint":"Ask your host for the PIN.","unlock":"Unlock itinerary →","invalid":"Please enter the full 8-digit PIN.","loading":"Unlocking…","network":"Unable to load the page. Check your connection and try again.","crypto":"Open this HTTPS link in a modern browser that supports secure encryption.","wrong":"Incorrect PIN. Please check and try again.","foot":"The itinerary is encrypted. This page does not save your PIN; refreshing locks it again.","home":"Back to homepage","language":"Language"},"zh-Hant":{"title":"輸入 PIN","intro":"輸入邀請人給你的 PIN，查看行程，並一起更新準備清單。","label":"8 位數字 PIN","hint":"PIN 請向邀請人索取。","unlock":"解鎖行程 →","invalid":"請輸入完整的 8 位數字 PIN。","loading":"正在解鎖…","network":"暫時無法載入頁面，請檢查網路後重試。","crypto":"請使用支援安全加密的新版瀏覽器開啟 HTTPS 連結。","wrong":"PIN 不正確，請確認後重試。","foot":"行程內容已加密。此頁面不會儲存你的 PIN；重新整理後需重新解鎖。","home":"返回個人首頁","language":"語言"}};
const form=document.getElementById('unlock'),field=document.getElementById('pin'),button=document.getElementById('button'),message=document.getElementById('error'),selector=document.getElementById('language');
const requested=new URL(location.href).searchParams.get('lang');let locale=requested==='en'?'en':requested==='zh-Hant'||requested==='zh-TW'?'zh-Hant':'zh-Hans',errorKey='';
const tr=key=>copy[locale][key];function render(){document.documentElement.lang=locale;document.title='Odyssey 2026 · '+tr('title');selector.value=locale;selector.setAttribute('aria-label',tr('language'));document.querySelectorAll('[data-copy]').forEach(el=>el.textContent=tr(el.dataset.copy));button.textContent=tr(button.disabled?'loading':'unlock');message.textContent=errorKey?tr(errorKey):'';}function showError(key){errorKey=key;render();}
selector.addEventListener('change',()=>{locale=selector.value;const url=new URL(location.href);url.searchParams.set('lang',locale);history.replaceState(null,'',url);render();});render();
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
form.addEventListener('submit',async event=>{event.preventDefault();const pin=field.value.replace(/[\s-]/g,'');if(!/^\d{8}$/.test(pin)){showError('invalid');return;}button.disabled=true;showError('');let payload;try{const response=await fetch('./content.enc.json',{cache:'no-store'});if(!response.ok)throw Error();payload=await response.json();}catch{button.disabled=false;showError('network');return;}try{if(!window.crypto?.subtle)throw Error('CRYPTO_UNAVAILABLE');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));field.value='';document.open();document.write(new TextDecoder().decode(plain));document.close();}catch(error){button.disabled=false;showError(error.message==='CRYPTO_UNAVAILABLE'?'crypto':'wrong');field.focus();}});
</script></body></html>
